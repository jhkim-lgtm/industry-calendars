<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{{DESC}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{FAVICON}}</text></svg>">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?{{GFONT_FAMILIES}}&display=swap" rel="stylesheet">
<style>
  :root{
{{VARS_LIGHT}}
  }
  @media (prefers-color-scheme: dark){
    :root{
{{VARS_DARK}}
    }
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    font-weight:400; font-size:15px; line-height:1.68; -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:{{DISPLAY_FONT}},"Noto Serif KR",Georgia,"Apple SD Gothic Neo",serif}
  .mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums}

  .wrap{max-width:1060px; margin:0 auto; padding:0 22px 90px}

  header{padding:44px 0 30px; border-bottom:2px solid var(--brand)}
  .byline{display:flex; align-items:center; gap:10px; margin-bottom:26px}
  .byline .cap{font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--sub)}
  .byline img{height:15px; width:auto; display:block; filter:invert(1)}
  @media (prefers-color-scheme: dark){.byline img{filter:none}}
  .eyebrow{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;
    font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--sub); margin-bottom:16px}
  .eyebrow b{color:var(--brand); font-weight:700}
  h1{margin:0; font-weight:600; font-size:clamp(34px,6.4vw,60px); line-height:1.12; letter-spacing:-.005em; text-wrap:balance}
  h1 .en{display:block; font-weight:400; font-size:.42em; letter-spacing:.14em; color:var(--acc); text-transform:uppercase; margin-bottom:10px}
  .lede{margin:18px 0 0; max-width:640px; color:var(--sub); font-size:15px}

  .now{margin:34px 0 0; border:1px solid var(--acc); background:var(--acc-soft); border-radius:2px; padding:22px 24px}
  .now-tag{display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--acc); font-weight:700; margin-bottom:10px}
  .now-tag .pulse{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.now-tag .pulse{animation:none}}
  .now h2{margin:0 0 6px; font-size:clamp(19px,3vw,26px); font-weight:600; line-height:1.35}
  .now p{margin:0; color:var(--sub); font-size:14px; max-width:720px}
  .now ul{margin:14px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
  .now li{display:flex; gap:10px; align-items:baseline; font-size:14px}
  .now li .d{flex:0 0 auto; font-size:12px; color:var(--acc); font-weight:700; min-width:52px}

  .radar{margin:26px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px}
  .radar-card{background:var(--card); border:1px solid var(--line-soft); border-radius:2px; padding:14px 16px; box-shadow:var(--shadow); border-top:2px solid var(--cat,var(--acc))}
  .radar-card .dd{font-size:11px; letter-spacing:.12em; font-weight:700; color:var(--cat,var(--acc)); text-transform:uppercase}
  .radar-card .t{font-size:14.5px; font-weight:500; margin:3px 0 1px; line-height:1.4}
  .radar-card .m{font-size:12.5px; color:var(--sub)}

  .filters{position:sticky; top:0; z-index:5; background:var(--bg); padding:16px 0 14px; margin-top:40px;
    border-bottom:1px solid var(--line-soft); display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .chip{border:1px solid var(--line); background:transparent; color:var(--sub); border-radius:999px;
    padding:5px 14px 6px; font-size:12.5px; font-family:inherit; cursor:pointer; letter-spacing:.02em; transition:all .15s}
  .chip .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--cc); margin-right:7px; vertical-align:1px}
  .chip.on{background:var(--brand); border-color:var(--brand); color:var(--chip-on-ink)}
  .chip:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
  .cal-nav{margin-left:auto; border:1px solid var(--line); background:var(--card); color:var(--sub); border-radius:999px;
    padding:5px 12px 6px; font-size:12.5px; font-family:inherit; cursor:pointer; max-width:220px}
  .cal-nav:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

  .month{padding:44px 0 8px}
  .month-head{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:22px}
  .month-num{font-size:clamp(38px,5.6vw,54px); line-height:1; font-weight:400; color:var(--acc)}
  .month-meta .y{font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--sub)}
  .month-meta .theme{font-size:15px; font-weight:700; margin-top:2px}
  .month-meta .theme .super{color:var(--acc)}
  .month-note{margin-left:auto; font-size:12.5px; color:var(--sub); max-width:360px; text-align:right}
  @media (max-width:640px){.month-note{margin-left:0; text-align:left}}

  .events{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .empty-month{grid-column:1/-1; border:1px dashed var(--line); border-radius:2px; padding:18px 20px; color:var(--sub); font-size:13px; letter-spacing:.02em}
  .ev{background:var(--card); border:1px solid var(--line-soft); border-left:3px solid var(--cat); border-radius:2px;
    padding:16px 18px 15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px}
  .ev.past{opacity:.45}
  .ev.hidden{display:none}
  .ev-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .ev-cat{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--cat)}
  .ev-dday{font-size:11px; font-weight:700; padding:2px 9px 3px; border-radius:999px; border:1px solid var(--line); color:var(--sub); white-space:nowrap}
  .ev-dday.live{background:var(--live-bg); border-color:transparent; color:var(--live)}
  .ev-dday.soon{background:var(--acc-soft); border-color:transparent; color:var(--acc)}
  .ev h3{margin:0; font-size:17px; font-weight:500; line-height:1.4; letter-spacing:-.01em}
  .ev .when{font-size:12.5px; color:var(--sub)}
  .ev .when b{color:var(--ink); font-weight:500}
  .ev .approx{font-size:10.5px; color:var(--sub); border:1px solid var(--line); border-radius:3px; padding:0 5px; margin-left:6px; letter-spacing:.05em}
  .ev .angles{border-top:1px dashed var(--line); margin-top:4px; padding-top:9px; display:flex; flex-direction:column; gap:6px}
  .ev .angle{font-size:12.8px; color:var(--sub); line-height:1.6}
  .ev .angle b{font-weight:700; color:var(--brand); font-size:11px; letter-spacing:.1em; margin-right:5px}
  .ev .angle.prep b{color:var(--acc)}

  .playbook{margin-top:70px; border-top:2px solid var(--brand); padding-top:34px}
  .pb-eyebrow{font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--acc); font-weight:700}
  .playbook h2{margin:8px 0 6px; font-weight:600; font-size:clamp(24px,3.6vw,34px); line-height:1.2}
  .playbook > p{color:var(--sub); max-width:660px; margin:0 0 26px; font-size:14.5px}
  .pb-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
  .pb{background:var(--card); border:1px solid var(--line-soft); border-top:2px solid var(--acc); border-radius:2px; padding:18px; box-shadow:var(--shadow)}
  .pb .d{font-size:13px; color:var(--brand); font-weight:700; letter-spacing:.08em}
  .pb .t{font-weight:700; font-size:14.5px; margin:6px 0 4px}
  .pb p{margin:0; font-size:13px; color:var(--sub); line-height:1.6}

  footer{margin-top:60px; padding-top:18px; border-top:1px solid var(--line-soft); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
    font-size:11.5px; color:var(--sub); letter-spacing:.06em}
  footer .brand{color:var(--brand); font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="byline"><span class="cap">Calendar by</span><img src="https://jhkim-lgtm.github.io/industry-calendars/logo-1club.png" alt="1%CLUB"></div>
    <div class="eyebrow">
      <span><b>1%CLUB</b>&nbsp; {{EYEBROW}}</span>
      <span id="today-label" class="mono"></span>
    </div>
    <h1 class="serif"><span class="en">{{H1_EN}}</span>{{H1_KO}}</h1>
    <p class="lede">{{LEDE}}</p>

    <div class="now">
      <div class="now-tag"><span class="pulse"></span>이번 주 시의성 브리핑</div>
      <h2 class="serif" id="now-title"></h2>
      <p id="now-sub"></p>
      <ul id="now-list"></ul>
    </div>

    <div class="radar" id="radar"></div>
  </header>

  <nav class="filters" id="filters" aria-label="카테고리 필터">
    <select class="cal-nav" id="cal-nav" aria-label="다른 캘린더로 이동" onchange="if(this.value)location.href=this.value">
      <option value="">다른 캘린더 ↗</option>
      <option value="https://jhkim-lgtm.github.io/industry-calendars/">전체 허브</option>
      <option value="https://jhkim-lgtm.github.io/luxe-calendar/">럭셔리 종합</option>
      <option value="https://jhkim-lgtm.github.io/industry-calendars/beauty/">뷰티</option>
      <option value="https://jhkim-lgtm.github.io/industry-calendars/fashion/">패션</option>
      <option value="https://jhkim-lgtm.github.io/industry-calendars/jewelry/">하이주얼리</option>
      <option value="https://jhkim-lgtm.github.io/industry-calendars/watches/">시계</option>
      <option value="https://jhkim-lgtm.github.io/industry-calendars/wellness/">웰니스&롱지비티</option>
    </select>
  </nav>

  <main id="months"></main>

  <section class="playbook">
    <div class="pb-eyebrow">Operating Rhythm</div>
    <h2 class="serif">{{PLAYBOOK_TITLE}}</h2>
    <p>{{PLAYBOOK_LEDE}}</p>
    <div class="pb-grid">
{{PLAYBOOK_CARDS}}
    </div>
  </section>

  <footer>
    <span>Prepared by <span class="brand">1%CLUB</span> — {{FOOTER_TAG}}</span>
    <span>날짜는 각 주최측 공식 발표 기준 · <span class="mono">±</span> 표기는 예상 시기(공식 미발표) · 기준일 <span class="mono" id="foot-date"></span></span>
  </footer>
</div>

<script>
{{DATA_JS}}


/* ── 내 일정: 이 브라우저(localStorage)에만 저장되는 개인 일정 ── */
CATS.custom={label:'내 일정', color:'var(--acc)'};
const CUSTOM_KEY='onecal_custom_'+location.pathname;
let CUSTOM=[];
try{CUSTOM=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]')}catch(e){CUSTOM=[]}
CUSTOM.forEach(c=>{if(c&&c.s&&c.title)EVENTS.push({s:c.s,e:c.e||c.s,cat:'custom',title:c.title,place:c.place||'',angle:c.memo||'직접 추가한 일정',prep:'—',sales:'—'});});

const $=s=>document.querySelector(s);
const fmt=(d)=>`${d.getMonth()+1}/${d.getDate()}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const today=new Date(); today.setHours(0,0,0,0);
const DAY=86400000;
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* 롤링 윈도우: 이번 달 1일 ~ 내년 12월 31일 */
const winStart=new Date(today.getFullYear(), today.getMonth(), 1);
const winEnd=new Date(today.getFullYear()+1, 11, 31);
const winStartKey=`${winStart.getFullYear()}-${String(winStart.getMonth()+1).padStart(2,'0')}`;
const visible=EVENTS.filter(ev=>parse(ev.e)>=winStart && parse(ev.s)<=winEnd);

const dateLabel=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
$('#today-label').textContent = `${dateLabel} 기준`;
$('#foot-date').textContent = dateLabel;

function status(ev){
  const s=parse(ev.s), e=parse(ev.e);
  if(today>e) return {k:'past'};
  if(today>=s) return {k:'live', label:'LIVE'};
  const d=Math.round((s-today)/DAY);
  return {k:d<=30?'soon':'future', label:`D-${d}`, d};
}

(function(){
  const active=visible.map(ev=>({ev,st:status(ev)})).filter(x=>x.st.k==='live'||(x.st.k!=='past'&&x.st.d<=10));
  const list=$('#now-list');
  if(active.length===0){
    $('#now-title').textContent='조용한 주간 — 준비의 시간';
    $('#now-sub').textContent='이번 주 임박한 대형 이벤트는 없습니다. 아래 레이더의 다가오는 이벤트를 미리 준비하세요.';
  }else{
    const live=active.filter(x=>x.st.k==='live').length;
    $('#now-title').textContent = live>0 ? '지금 진행 중인 모먼트' : '이번 주, 준비할 것들';
    $('#now-sub').textContent='진행 중이거나 10일 안에 시작되는 이벤트입니다. 캠페인·콘텐츠·준비 체계를 점검하세요.';
    active.sort((a,b)=>parse(a.ev.s)-parse(b.ev.s)).forEach(({ev,st})=>{
      const li=document.createElement('li');
      li.innerHTML=`<span class="d mono">${st.label}</span><span><b>${ev.title}</b> · ${fmt(parse(ev.s))}–${fmt(parse(ev.e))} ${ev.place}</span>`;
      list.appendChild(li);
    });
  }
})();

(function(){
  const up=visible.map(ev=>({ev,st:status(ev)})).filter(x=>x.st.k==='soon'||x.st.k==='future')
    .sort((a,b)=>parse(a.ev.s)-parse(b.ev.s)).slice(0,4);
  const radar=$('#radar');
  up.forEach(({ev,st})=>{
    const c=document.createElement('div'); c.className='radar-card';
    c.style.setProperty('--cat',CATS[ev.cat].color);
    c.innerHTML=`<div class="dd mono">${st.label} · ${CATS[ev.cat].label}</div>
      <div class="t">${ev.title}</div>
      <div class="m">${fmt(parse(ev.s))}–${fmt(parse(ev.e))} · ${ev.place}</div>`;
    radar.appendChild(c);
  });
})();

(function(){
  const f=$('#filters');
  const mk=(key,label,color)=>{
    const b=document.createElement('button'); b.className='chip'+(key==='all'?' on':''); b.dataset.cat=key;
    b.innerHTML=(color?`<span class="dot" style="--cc:${color}"></span>`:'')+label;
    b.addEventListener('click',()=>{
      f.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.cat===key));
      document.querySelectorAll('.ev').forEach(el=>el.classList.toggle('hidden',key!=='all'&&el.dataset.cat!==key));
      document.querySelectorAll('.month').forEach(m=>{
        const any=[...m.querySelectorAll('.ev')].some(el=>!el.classList.contains('hidden'));
        m.style.display=(key==='all'||any)?'':'none';
      });
    });
    f.appendChild(b);
  };
  mk('all','전체 보기',null);
  Object.entries(CATS).forEach(([k,v])=>mk(k,v.label,v.color));
  f.appendChild($('#cal-nav')); /* 드롭다운을 칩 뒤(우측)로 이동 */
})();

(function(){
  const byMonth={};
  visible.forEach(ev=>{
    let key=ev.s.slice(0,7);
    if(key<winStartKey) key=winStartKey;
    (byMonth[key]=byMonth[key]||[]).push(ev);
  });
  const root=$('#months');
  /* 윈도우 안 모든 달을 빠짐없이 렌더링 (이벤트 없는 달 포함) */
  const allKeys=[];
  for(let d=new Date(winStart); d<=winEnd; d=new Date(d.getFullYear(), d.getMonth()+1, 1)){
    allKeys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  allKeys.forEach(key=>{
    const [y,m]=key.split('-').map(Number);
    const meta=(typeof MONTH_THEMES!=='undefined'&&MONTH_THEMES[key])||{theme:''};
    const sec=document.createElement('section'); sec.className='month';
    sec.innerHTML=`<div class="month-head">
        <div class="month-num serif">${String(m).padStart(2,'0')}</div>
        <div class="month-meta">
          <div class="y mono">${MONTH_NAMES[m-1]} ${y}</div>
          <div class="theme">${meta.super?'<span class="super">◆ </span>':''}${meta.theme||''}</div>
        </div>
        ${meta.note?`<div class="month-note">${meta.note}</div>`:''}
      </div>
      <div class="events"></div>`;
    const grid=sec.querySelector('.events');
    const evs=byMonth[key]||[];
    if(evs.length===0){
      grid.innerHTML='<div class="empty-month">이 달은 예정된 대형 이벤트가 없습니다 — 다음 시즌을 준비하는 구간.</div>';
    }
    evs.sort((a,b)=>parse(a.s)-parse(b.s)).forEach(ev=>{
      const st=status(ev);
      const card=document.createElement('article');
      card.className='ev'+(st.k==='past'?' past':'');
      card.dataset.cat=ev.cat;
      card.style.setProperty('--cat',CATS[ev.cat].color);
      const dday= st.k==='past' ? `<span class="ev-dday">종료</span>`
        : st.k==='live' ? `<span class="ev-dday live">● LIVE</span>`
        : `<span class="ev-dday ${st.k==='soon'?'soon':''} mono">${st.label}</span>`;
      const sd=parse(ev.s), ed=parse(ev.e);
      const range = ev.s===ev.e ? fmt(sd) : `${fmt(sd)} – ${fmt(ed)}`;
      card.innerHTML=`
        <div class="ev-top"><span class="ev-cat">${CATS[ev.cat].label}</span>${dday}</div>
        <h3>${ev.title}</h3>
        <div class="when"><b class="mono">${range}</b> · ${ev.place}${ev.approx?'<span class="approx">± 예상 시기</span>':''}</div>
        <div class="angles">
          <div class="angle"><b>MARKETING</b>${ev.angle}</div>
          ${ev.prep&&ev.prep!=='—'?`<div class="angle prep"><b>PREP</b>${ev.prep}</div>`:''}
        </div>`;
      grid.appendChild(card);
    });
    root.appendChild(sec);
  });
})();

/* ── 내 일정 추가 UI ── */
(function(){
  const A=`var(--acc, var(--point, var(--gold, var(--bronze))))`;
  const st=document.createElement('style');
  st.textContent=`
  .addev-fab{position:fixed;right:20px;bottom:20px;z-index:50;border:none;border-radius:999px;padding:12px 18px;font-size:13.5px;font-weight:700;font-family:inherit;color:#fff;background:${A};box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
  .addev-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
  .addev-ov.open{display:flex}
  .addev-md{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;max-width:430px;width:100%;max-height:85vh;overflow:auto;padding:22px}
  .addev-md h3{margin:0 0 4px;font-size:17px}
  .addev-md .hint{font-size:12px;color:var(--sub);margin:0 0 14px}
  .addev-md label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin:10px 0 4px;letter-spacing:.06em}
  .addev-md input,.addev-md textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);padding:8px 10px;font-size:14px;font-family:inherit}
  .addev-row{display:flex;gap:10px}.addev-row>div{flex:1}
  .addev-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .addev-actions button{border-radius:4px;padding:8px 16px;font-size:13.5px;font-family:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--sub)}
  .addev-actions .pri{background:${A};border-color:transparent;color:#fff;font-weight:700}
  .addev-list{margin:0 0 6px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .addev-list li{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13px;border:1px solid var(--line-soft);border-radius:4px;padding:6px 10px}
  .addev-list .del{border:none;background:none;color:var(--sub);cursor:pointer;font-size:12px;text-decoration:underline;font-family:inherit}`;
  document.head.appendChild(st);

  const ov=document.createElement('div'); ov.className='addev-ov';
  ov.innerHTML=`<div class="addev-md" role="dialog" aria-modal="true">
    <h3>내 일정</h3>
    <p class="hint">이 브라우저(기기)에만 저장됩니다. 캘린더 본문에 D-day와 함께 표시돼요.</p>
    <ul class="addev-list" id="addev-list"></ul>
    <label>제목 *</label><input id="ae-title" type="text" maxlength="60">
    <div class="addev-row">
      <div><label>시작일 *</label><input id="ae-s" type="date"></div>
      <div><label>종료일 (선택)</label><input id="ae-e" type="date"></div>
    </div>
    <label>장소 (선택)</label><input id="ae-place" type="text" maxlength="40">
    <label>메모 (선택)</label><textarea id="ae-memo" rows="2" maxlength="140"></textarea>
    <div class="addev-actions">
      <button type="button" id="ae-close">닫기</button>
      <button type="button" class="pri" id="ae-save">저장</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  const btn=document.createElement('button'); btn.className='addev-fab'; btn.type='button'; btn.textContent='＋ 내 일정 추가';
  document.body.appendChild(btn);

  function renderList(){
    const ul=ov.querySelector('#addev-list'); ul.innerHTML='';
    CUSTOM.forEach((c,i)=>{
      const li=document.createElement('li');
      li.innerHTML=`<span><b>${c.title}</b> · ${c.s}${c.e&&c.e!==c.s?'–'+c.e:''}</span>`;
      const del=document.createElement('button'); del.className='del'; del.textContent='삭제';
      del.addEventListener('click',()=>{CUSTOM.splice(i,1);localStorage.setItem(CUSTOM_KEY,JSON.stringify(CUSTOM));location.reload();});
      li.appendChild(del); ul.appendChild(li);
    });
  }
  btn.addEventListener('click',()=>{renderList();ov.classList.add('open');});
  ov.querySelector('#ae-close').addEventListener('click',()=>ov.classList.remove('open'));
  ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});
  ov.querySelector('#ae-save').addEventListener('click',()=>{
    const t=ov.querySelector('#ae-title').value.trim(), s=ov.querySelector('#ae-s').value;
    if(!t||!s){alert('제목과 시작일을 입력해 주세요.');return;}
    const e=ov.querySelector('#ae-e').value;
    CUSTOM.push({title:t,s:s,e:(e&&e>=s)?e:s,place:ov.querySelector('#ae-place').value.trim(),memo:ov.querySelector('#ae-memo').value.trim()});
    localStorage.setItem(CUSTOM_KEY,JSON.stringify(CUSTOM));
    location.reload();
  });
})();


/* ── 출력용 보기 (인쇄·PDF 저장) ── */
(function(){
  var st=document.createElement('style');
  st.textContent=`
  .print-toggle{position:fixed;right:20px;bottom:72px;z-index:50;border:1px solid var(--line);border-radius:999px;
    padding:10px 16px;font-size:13px;font-weight:600;font-family:inherit;background:var(--card);color:var(--ink);
    box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
  .print-toggle:focus-visible{outline:2px solid currentColor;outline-offset:2px}
  .print-bar{position:fixed;top:0;left:0;right:0;z-index:70;display:none;align-items:center;gap:12px;
    justify-content:center;flex-wrap:wrap;padding:9px 16px;background:#141414;color:#fff;font-size:12.5px;letter-spacing:.02em}
  .print-bar button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;
    padding:4px 13px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .print-bar .pri{background:#fff;color:#141414;border-color:#fff;font-weight:700}
  body.printview .print-bar{display:flex}
  body.printview{--bg:#fff;--card:#fff;--ink:#111;--sub:#4a4a4a;--line:rgba(0,0,0,.24);--line-soft:rgba(0,0,0,.12);
    --shadow:none;background:#fff;color:#111;font-size:12.5px;padding-top:40px}
  body.printview .wrap{max-width:1180px;padding:0 16px 28px}
  body.printview header{padding:16px 0 12px}
  body.printview .byline{margin-bottom:12px}
  body.printview .lede,body.printview .now p,body.printview .playbook>p{display:none}
  body.printview .now{padding:12px 15px;margin-top:14px}
  body.printview .now ul{margin-top:8px}
  body.printview .radar{gap:8px;margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  body.printview .radar-card{padding:9px 11px}
  body.printview .month{padding:16px 0 4px}
  body.printview .month-head{padding-bottom:6px;margin-bottom:10px}
  body.printview .events{grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
  body.printview .ev{padding:9px 11px;gap:5px;border:1px solid rgba(0,0,0,.2);box-shadow:none;border-radius:2px}
  body.printview .ev h3{font-size:13.5px}
  body.printview .ev .angles{padding-top:6px;gap:4px}
  body.printview .ev .angle{font-size:11px;line-height:1.45}
  body.printview .playbook{margin-top:26px;padding-top:16px}
  body.printview .pb{padding:11px}
  body.printview .filters,body.printview .addev-fab,body.printview .print-toggle{display:none}
  body.printview .month,body.printview .ev,body.printview .playbook,body.printview .now{break-inside:avoid;page-break-inside:avoid}
  @media print{
    .filters,.addev-fab,.print-toggle,.print-bar,.addev-ov{display:none!important}
    body{padding-top:0!important;background:#fff!important;color:#111!important}
    .month,.ev,.playbook,.now,.pb{break-inside:avoid;page-break-inside:avoid}
    a{text-decoration:none;color:inherit}
    @page{size:A4 landscape;margin:10mm}
  }`;
  document.head.appendChild(st);

  var bar=document.createElement('div'); bar.className='print-bar';
  bar.innerHTML='<span>출력용 보기 — 이 화면 그대로 인쇄하거나 PDF로 저장하세요 (A4 가로 권장)</span>';
  var bp=document.createElement('button'); bp.type='button'; bp.className='pri'; bp.textContent='인쇄 · PDF 저장';
  var be=document.createElement('button'); be.type='button'; be.textContent='원래대로';
  bar.appendChild(bp); bar.appendChild(be);
  document.body.appendChild(bar);

  var tg=document.createElement('button'); tg.type='button'; tg.className='print-toggle'; tg.textContent='🖨 출력용 보기';
  document.body.appendChild(tg);

  tg.addEventListener('click',function(){document.body.classList.add('printview');window.scrollTo(0,0);});
  be.addEventListener('click',function(){document.body.classList.remove('printview');});
  bp.addEventListener('click',function(){window.print();});
})();

</script>
</body>
</html>
